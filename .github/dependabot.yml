version: 2

updates:
  # GitHub Actions used by ci.yml / publish.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"

  # Python dependencies resolved from pyproject.toml / uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    # feathers-cli is a published library: its pyproject floors bound what
    # downstream installs may resolve, so bumps move uv.lock only and never
    # raise a floor. Raise one by hand when a security fix requires it.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
